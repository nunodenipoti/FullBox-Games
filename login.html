    <main>
      <section class="container-gb">
        <h1>Entrar</h1>
        <form id="form-login" class="form-gb" onsubmit="return entrar();">
          <label>E-mail <input type="email" id="email" required placeholder="voce@email.com" /></label>
          <label>Senha <input type="password" id="senha" required minlength="6" placeholder="mínimo 6 caracteres" /></label>
          <button class="btn-gb" type="submit">Entrar</button>
        </form>
        <p id="msg-form"></p>
        <p>Novo por aqui? <a href="cadastro.html">Crie sua conta</a></p>
      </section>
