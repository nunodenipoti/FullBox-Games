    <main>
      <section class="container-gb">
        <h1>Criar conta</h1>
        <form id="form-cadastro" class="form-gb" onsubmit="return cadastrar();">
          <label class="form-label">Nome <input class="form-control" type="text" id="nome" required minlength="3" pattern="[A-Za-zÀ-ÿ ]+" title="Use apenas letras e espaços" placeholder="Seu nome" /></label>
          <label class="form-label">E-mail <input class="form-control" type="email" id="email" required placeholder="voce@email.com" /></label>
          <label class="form-label">Senha <input class="form-control" type="password" id="senha" required minlength="6" placeholder="mínimo 6 caracteres" /></label>
          <label class="form-label">Confirmar senha <input class="form-control" type="password" id="senha2" required minlength="6" placeholder="repita a senha" /></label>
          <button class="btn btn-gb" type="submit">Cadastrar</button>
        </form>
        <p id="msg-form"></p>
        <p>Já tem conta? <a href="login.html">Entrar</a></p>
      </section>
    </main>
