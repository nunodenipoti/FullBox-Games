<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carrinho | FullBox Games</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body onload="mostrarCarrinho()">
    <header class="nav-puro">
      <a class="marca" href="index.html">FullBox Games</a>
      <nav>
        <a href="index.html">Início</a>
        <a href="loja.html">Loja</a>
        <a href="blog.html">Notícias</a>
        <a href="ranking.html">Ranking</a>
        <a href="sobre.html">Sobre</a>
        <a href="contato.html">Contato</a>
        <a href="https://store.steampowered.com" target="_blank" rel="noopener">Steam ↗</a>
        <a class="ativo" href="carrinho.html" aria-current="page">Carrinho <span class="badge-gb" id="badge-carrinho">0</span></a>
        <a href="login.html">Entrar</a>
      </nav>
    </header>
    <main>
      <section class="container-gb">
        <h1>Carrinho</h1>
        <div class="tabela-rolagem">
          <table class="dados">
            <thead>
              <tr>
                <th scope="col">Jogo</th>
                <th scope="col">Preço</th>
                <th scope="col">Ação</th>
              </tr>
            </thead>
            <tbody id="corpo-carrinho"></tbody>
          </table>
        </div>
        <div class="cupom">
          <label for="cupom">Cupom:</label>
          <input type="text" id="cupom" placeholder="GAME10" />
          <button class="btn-gb claro" type="button" onclick="aplicarCupom()">Aplicar</button>
        </div>
        <h2>Total: <span id="total">R$ 0,00</span></h2>
        <button class="btn-gb" type="button" onclick="finalizarCompra()">Finalizar compra</button>
        <p id="msg-cupom"></p>
      </section>
    </main>
    <footer>
      <p>© 2026 FullBox Games · Projeto acadêmico de loja de jogos online</p>
      <p><a href="contato.html">Contato</a> · <a href="patrocinio.html">Anuncie aqui</a> · <a href="cadastro.html">Criar conta</a></p>
    </footer>
    <script src="js/app.js"></script>
  </body>
