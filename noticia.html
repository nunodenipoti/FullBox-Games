    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
      var noticias = [
        {
          titulo: "GTA VI: Rockstar confirma novos detalhes",
          img: "img/noticia-1.jpg",
          texto: "A Rockstar Games revelou detalhes inéditos sobre o tamanho do mapa e a ambientação de Vice City, deixando os fãs ainda mais ansiosos pelo lançamento.",
          texto2: "Segundo o estúdio, o foco está em um mundo aberto vivo, com mais atividades e personagens marcantes."
        },
        {
          titulo: "Call of Duty: Warzone recebe grande atualização",
          img: "img/noticia-2.jpg",
          texto: "A Activision anunciou mudanças no passe de batalha e a chegada de um novo mapa, trazendo mais variedade às partidas do battle royale.",
          texto2: "A atualização também promete ajustes de equilíbrio nas armas e melhorias de desempenho."
        },
        {
          titulo: "EA Sports UFC 6: EA revela melhorias na física",
          img: "img/noticia-3.jpg",
          texto: "A nova edição da franquia promete um sistema de impacto mais realista, com golpes e quedas que reagem melhor ao peso e à posição dos lutadores.",
          texto2: "A EA também fala em novas animações e em um modo carreira revisado."
        }
      ];

      function mostrarNoticia() {
        var id = location.search.replace("?id=", "");
        var n = noticias[id - 1];
        if (n == undefined) {
          n = noticias[0];
        }
        document.title = n.titulo + " | FullBox Games";
        var capa = document.getElementById("capa");
        capa.src = n.img;
        capa.alt = n.titulo;
        escrever("titulo", n.titulo);
        escrever("texto", n.texto);
        escrever("texto2", n.texto2);
      }

      mostrarNoticia();
    </script>
